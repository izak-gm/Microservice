# PostgreSQL Database Configuration
POSTGRES_HOST=localhost       # Hostname of the PostgreSQL server
POSTGRES_PORT=5432            # Port number for PostgreSQL
POSTGRES_DB=Microservice       # Name of the PostgreSQL database
POSTGRES_USER=postgres         # Database username
POSTGRES_PASSWORD=izak7901   # Database password

# Optional settings
POSTGRES_SCHEMA=public        # Schema name (default: public)
POSTGRES_POOL_MAX=10          # Maximum number of connections in the pool
POSTGRES_POOL_MIN=1           # Minimum number of connections in the pool
POSTGRES_IDLE_TIMEOUT=30000   # Connection idle timeout in milliseconds
